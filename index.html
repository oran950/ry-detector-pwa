<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crying/Screaming Detector</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png" />
  <meta name="theme-color" content="#007BFF" />
  <style>
    :root {
      --bg: #f9f9f9;
      --text: #000;
      --btn: #007BFF;
      --accent: #28a745;
    }
    body.dark {
      --bg: #121212;
      --text: #fff;
      --btn: #444;
      --accent: #00e676;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", sans-serif;
      margin: 0;
      padding: 0 15px;
      max-width: 600px;
      margin: auto;
    }

    header {
      text-align: center;
      padding: 20px 0 10px;
      background: var(--btn);
      color: white;
      border-radius: 0 0 10px 10px;
    }

    h1 {
      font-size: 1.5rem;
      margin: 0;
    }

    #upload-section {
      margin: 20px 0;
      text-align: center;
    }

    #uploadBtn, #recordBtn, #toggleDark {
      width: 100%;
      margin-top: 10px;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background-color: var(--btn);
      color: white;
      font-size: 1rem;
      cursor: pointer;
    }

    #waveform {
      margin-top: 15px;
      height: 100px;
      background: #e9ecef;
      border-radius: 6px;
    }

    #result {
      margin-top: 20px;
    }

    button.play-btn {
      width: 100%;
      margin-top: 8px;
      padding: 10px;
      background-color: var(--accent);
      color: white;
      font-size: 1rem;
      border: none;
      border-radius: 6px;
    }

    footer {
      text-align: center;
      margin-top: 40px;
      font-size: 0.85rem;
      color: #aaa;
    }
  </style>
</head>
<body>
  <header>
    <h1>Sound Alert Detector</h1>
  </header>

  <div id="upload-section">
    <input type="file" id="uploadBtn" accept="audio/*" />
    <button id="recordBtn">🎤 Record from Microphone</button>
    <button id="toggleDark">🌓 Toggle Dark Mode</button>
    <div id="waveform"></div>
  </div>

  <div id="result">Upload or record audio to begin.</div>

  <footer>All processing is local. No files are uploaded.</footer>

  <script src="https://unpkg.com/wavesurfer.js@6.6.4"></script>
  <script src="https://unpkg.com/wavesurfer.js@6.6.4/dist/plugin/wavesurfer.regions.min.js"></script>
  <script src="script.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('service-worker.js')
        .then(() => console.log('✅ Service Worker registered'))
        .catch(err => console.error('Service Worker registration failed:', err));
    }

    document.getElementById("toggleDark").onclick = () =>
      document.body.classList.toggle("dark");
  </script>
</body>
</html>

  </script>

</body>
</html>
