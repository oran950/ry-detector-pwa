<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Crying/Screaming Detector</title>
  <style>
    body { font-family: Arial; padding: 20px; }
    #waveform { margin-top: 20px; border: 1px solid #ccc; height: 100px; }
    button { margin: 5px 0; }
  </style>
</head>
<body>
  <h2>Upload Audio File</h2>
  <input type="file" id="uploadBtn" accept="audio/*" />
  <div id="waveform"></div>
  <div id="result">Waiting for result...</div>

  <!-- WaveSurfer v6 for plugin compatibility -->
  <script src="https://unpkg.com/wavesurfer.js@6.6.4"></script>
  <script src="https://unpkg.com/wavesurfer.js@6.6.4/dist/plugin/wavesurfer.regions.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
